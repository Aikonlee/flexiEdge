set default="0"
set timeout=30

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

search --no-floppy --set=root --file /live/vmlinuz

menuentry "Install flexiWAN Router (UEFI)" {
    search --no-floppy --set=root --file /live/vmlinuz
    linux  /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0 flexi_mode=vga
    initrd /live/initrd.img
}

menuentry "Install flexiWAN Router via serial port (UEFI)" {
    search --no-floppy --set=root --file /live/vmlinuz
    linux  /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=false console=tty0 console=ttyS0,115200n8 flexi_mode=serial
    initrd /live/initrd.img
}
